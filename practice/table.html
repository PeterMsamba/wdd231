<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    table {
      border-collapse: collapse;
      border: 2px solid rgb(140, 140, 140);
      letter-spacing: 1px;
    }

    th,
    td {
      border: 1px solid rgb(150, 150, 150);
      padding: 8px 12px;
    }
    thead{
      background-color: rgb(33, 30, 30);
      color: white;
      font-weight: 700;
    }
    tbody tr:nth-child(even):hover{
      background-color: rgb(211, 206, 206);
      cursor: pointer;
    }
    tfoot{
      background-color: rgb(33, 30, 30);
      color: white;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <table>
    <thead>
      <tr>
        <th>League</th>
        <th>Team</th>
        <th>Record</th>
        <th>Player Count</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td rowspan="2">Southern</td>
        <td>Parana</td>
        <td>52-19</td>
        <td>23</td>
      </tr>
      <tr>
        <td>Caterina</td>
        <td>49-24</td>
        <td>12</td>
      </tr>
      <tr>
        <td rowspan="3">Western</td>
        <td>Lacerda</td>
        <td>92-70</td>
        <td>27</td>
      </tr>
      <tr>
        <td>Acre</td>
        <td>92-70</td>
        <td>27</td>
      </tr>
      <tr>
        <td>Rondonia</td>
        <td>92-70</td>
        <td>27</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <td colspan="3">Total Player</td>
        <td>92</td>
      </tr>
    </tfoot>
  </table>


  <script>

  </script>
</body>

</html>
