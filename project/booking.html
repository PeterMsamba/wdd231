<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking & Contact | PickFord Acres</title>
    <meta name="description" content="Reserve your room or contact PickFord Acres administration.">
    <meta name="author" content="Your Name">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/large.css" media="(min-width: 600px)">
    <script type="module" src="scripts/main.js"></script>
</head>
<body>
    <header>
        <h1>PickFord Acres</h1>
        <button id="menu-button" aria-label="Toggle Menu">&#9776;</button>
        <nav id="nav-menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="rooms.html">Rooms</a></li>
                <li><a href="booking.html" class="active">Booking</a></li>
            </ul>
        </nav>
    </header>

    <main class="booking-container">
        <section class="booking-form-section">
            <h2 id="welcome-back">Secure Your Stay</h2>
            <form id="booking-form" action="thanks.html" method="get">
                <fieldset>
                    <legend>Personal Information</legend>
                    <label for="fname">First Name* <input type="text" id="fname" name="fname" required></label>
                    <label for="lname">Last Name* <input type="text" id="lname" name="lname" required></label>
                    <label for="email">Email* <input type="email" id="email" name="email" required placeholder="name@example.com"></label>
                </fieldset>

                <fieldset>
                    <legend>Stay Details</legend>
                    <label for="room-type">Preferred Room Type
                        <select id="room-type" name="room-type">
                            <option value="single">Single Suite</option>
                            <option value="double">Premium Vista</option>
                            <option value="shared">Economy Shared</option>
                        </select>
                    </label>
                    <label for="arrival">Arrival Date* <input type="date" id="arrival" name="arrival" required></label>
                </fieldset>

                <input type="submit" value="Book Room Now" class="cta-btn">
            </form>
        </section>

        <section class="contact-info">
            <h2>Contact Us</h2>
            <p><strong>Address:</strong> 123 Academic Way, North Campus</p>
            <p><strong>Phone:</strong> (555) 123-4567</p>
            <p><strong>Email:</strong> admin@pickfordacres.com</p>
            <div class="map-placeholder">
                <p>[Interactive Map Coming Soon]</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> PickFord Acres | <a href="attributions.html">Attributions</a></p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
