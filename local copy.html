<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Persistent Clicker</title>
</head>

<body>
  <div class="game-container">
    <h1>Clicker Game</h1>
    <div id="counter">0</div>
    <button id="clickBtn">Click Me!</button>
  </div>

  <script>
    const clickbtnz = document.querySelector('#clickBtn');
    const display = document.querySelector('#counter');

    let number = JSON.parse(localStorage.getItem('savedScore')) || 0;

    display.textContent = number;

    clickbtnz.addEventListener('click', () => {
      number = number + 1;
      
      display.textContent = number;
      
      localStorage.setItem('savedScore', JSON.stringify(number));
      console.log(number);
    });
  </script>
</body>
</html>
